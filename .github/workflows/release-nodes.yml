# Releases the ComfyUI node pack: tag the app repo with nodes-v<version> (matching
# comfyui-novafield/pyproject.toml) and this copies the pack into its standalone repo and tags it.
# That repo's own workflow then publishes to the Comfy Registry.
#
# Setup, once:
#   - repository variable NODES_REPO = owner/name of the standalone pack repo (e.g. KantLex/ComfyUI-NovaField)
#   - secret NODES_REPO_TOKEN = a fine-grained token with "Contents: read and write" on that repo
name: Release node pack

on:
  push:
    tags: ["nodes-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: ${{ vars.NODES_REPO != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Read the pack version
        id: version
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('app/comfyui-novafield/pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "nodes-v$v" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $v"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the pack
        working-directory: app/comfyui-novafield
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest
          pytest -q

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.NODES_REPO }}
          token: ${{ secrets.NODES_REPO_TOKEN }}
          path: standalone

      - name: Copy the pack and tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rsync -a --delete --exclude .git --exclude tests/_out --exclude __pycache__ --exclude .pytest_cache --exclude .DS_Store app/comfyui-novafield/ standalone/
          cd standalone
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed in the pack."; else git commit -m "Release v$VERSION"; fi
          git tag -f "v$VERSION"
          git push origin HEAD
          git push -f origin "v$VERSION"
